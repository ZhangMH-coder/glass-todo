[package]
name = "glass-todo"
version = "0.1.0"
description = "玻璃拟态待办事项桌面应用（Tauri 2）"
authors = ["GlassTodo"]
edition = "2021"

[lib]
name = "glass_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 毛玻璃：Windows 11 Mica / Acrylic，Win10 Blur（与参考图"云母效果/兼容模式"对应）
window-vibrancy = "0.6"
# SQLite 存储（bundled 编译内置 SQLite，无需系统依赖）
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
# docx 解析：解压 zip + 提取 document.xml 纯文本
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
